[project]
name = "studio"
version = "0.1.0"
description = "ai-video-studio 后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "sse-starlette>=2.1,<3",
    "claude-agent-sdk>=0.2.160,<0.3",
    "openai-agents[litellm]>=0.22.3,<0.23",
    "manim>=0.18,<1",
    "pyflakes>=3.4,<4",
    "pillow>=11,<13",
    "httpx>=0.27,<1",
    "mutagen>=1.48.1,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
    "pyright>=1.1,<2",
    "import-linter>=2.1,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "respx>=0.20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入约定就是在参数默认值里调用 `Depends()`/`Query()`（结果
# 不可变、每次调用等价于工厂函数），B008（"不要在默认值里调用函数"）不适用
# 于这个模式。
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not smoke and not slow'"
markers = [
    "smoke: 需要真实 API key 的冒烟测试，默认从 `make check` 排除，由 `make smoke` 运行",
    "slow: 需要实际起 manim/ffmpeg 子进程渲染的慢测试，默认从 `make check` 排除，用 `-m slow` 单独跑",
]

[tool.importlinter]
# R1（控制者裁定）：每个任务新建模块时，把 ARCHITECTURE §2 对应的分层规则
# 补进这里。T1 时只有 studio.config 和 studio.main；T2 新增 studio.db。
root_package = "studio"

[[tool.importlinter.contracts]]
name = "config 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.config"]
forbidden_modules = ["studio.main"]

[[tool.importlinter.contracts]]
name = "config 不依赖 db（config 层不依赖任何其他模块）"
type = "forbidden"
source_modules = ["studio.config"]
forbidden_modules = ["studio.db"]

[[tool.importlinter.contracts]]
name = "只有 db 定义 ORM 模型；其他模块只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.main"]
forbidden_modules = ["studio.db.models"]
# T7 之前 main 只 import studio.config，没有走到 db.repo 的间接路径；现在
# main 组装 agent/api，经 db.repo（合法路径）间接用到 db.models 很正常，
# 只禁止绕过 repo 直接 import 模型（和 workspace/agent 的同名契约一致）。
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "workspace 不直接依赖 db.models，只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.workspace"]
forbidden_modules = ["studio.db.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "workspace 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.workspace"]
forbidden_modules = ["studio.main"]

[[tool.importlinter.contracts]]
name = "agent 不 import stages（规则 2）：TurnRunner 只认识阶段定义协议"
type = "forbidden"
source_modules = ["studio.agent"]
forbidden_modules = ["studio.stages"]

[[tool.importlinter.contracts]]
name = "agent 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.agent"]
forbidden_modules = ["studio.main"]

[[tool.importlinter.contracts]]
name = "agent 不直接依赖 db.models，只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.agent"]
forbidden_modules = ["studio.db.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "各阶段之间互不 import（规则 3）：共用代码放进 stages.common"
type = "independence"
modules = [
    "studio.stages.topic",
    "studio.stages.narrative",
    "studio.stages.animation",
]

[[tool.importlinter.contracts]]
name = "stages 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.stages"]
forbidden_modules = ["studio.main"]

[[tool.importlinter.contracts]]
name = "只有 main 能 import api（规则 1：api 是组装层）"
type = "forbidden"
source_modules = [
    "studio.config",
    "studio.db",
    "studio.workspace",
    "studio.agent",
    "studio.stages",
]
forbidden_modules = ["studio.api"]

[[tool.importlinter.contracts]]
name = "api 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.api"]
forbidden_modules = ["studio.main"]

[[tool.importlinter.contracts]]
name = "api 不直接依赖 db.models，只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.api"]
forbidden_modules = ["studio.db.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "分层（ARCHITECTURE §2 依赖表）：main > api > stages > agent > workspace > db > config"
type = "layers"
# 上层可以 import 下层，下层不能 import 上层（含间接 import）。engines（M2 T1）、
# jobs（M2 T3）、worker（M2 T5）、search（M4 T1）不在这条链上，各自已有独立的 forbidden
# 契约（见下）。各阶段之间的独立性由上面的
# independence 契约保证。
layers = [
    "studio.main",
    "studio.api",
    "studio.stages",
    "studio.agent",
    "studio.workspace",
    "studio.db",
    "studio.config",
]

[[tool.importlinter.contracts]]
name = "stages 不直接依赖 db.models，只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.stages"]
forbidden_modules = ["studio.db.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "search 是纯能力层（规则 4）：只依赖 config，不访问数据库，不知道项目和阶段的存在"
type = "forbidden"
source_modules = ["studio.search"]
forbidden_modules = [
    "studio.main",
    "studio.api",
    "studio.stages",
    "studio.agent",
    "studio.workspace",
    "studio.db",
    "studio.engines",
    "studio.jobs",
]

[[tool.importlinter.contracts]]
name = "engines 是纯能力层（规则 4）：只依赖 config，不访问数据库，不知道项目和阶段的存在"
type = "forbidden"
source_modules = ["studio.engines"]
forbidden_modules = [
    "studio.main",
    "studio.api",
    "studio.stages",
    "studio.agent",
    "studio.workspace",
    "studio.db",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "jobs 不直接依赖 db.models，只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.jobs"]
forbidden_modules = ["studio.db.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "jobs 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.jobs"]
forbidden_modules = ["studio.main"]

[[tool.importlinter.contracts]]
name = "没有模块 import worker（规则 1：worker 是组装层，M2 T5）"
type = "forbidden"
source_modules = [
    "studio.config",
    "studio.db",
    "studio.workspace",
    "studio.agent",
    "studio.stages",
    "studio.api",
    "studio.jobs",
    "studio.engines",
]
forbidden_modules = ["studio.worker"]

[[tool.importlinter.contracts]]
name = "worker 不直接依赖 db.models，只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.worker"]
forbidden_modules = ["studio.db.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "worker 只依赖 jobs/engines/workspace/db/config（ARCHITECTURE §2 依赖表），不依赖 agent/stages/api/main"
type = "forbidden"
source_modules = ["studio.worker"]
forbidden_modules = [
    "studio.agent",
    "studio.stages",
    "studio.api",
    "studio.main",
]
