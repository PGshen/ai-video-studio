[project]
name = "studio"
version = "0.1.0"
description = "ai-video-studio 后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
    "pyright>=1.1,<2",
    "import-linter>=2.1,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "smoke: 需要真实 API key 的冒烟测试，默认从 `make check` 排除，由 `make smoke` 运行",
]

[tool.importlinter]
# R1（控制者裁定）：每个任务新建模块时，把 ARCHITECTURE §2 对应的分层规则
# 补进这里。T1 时只有 studio.config 和 studio.main；T2 新增 studio.db。
root_package = "studio"

[[tool.importlinter.contracts]]
name = "config 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.config"]
forbidden_modules = ["studio.main"]

[[tool.importlinter.contracts]]
name = "config 不依赖 db（config 层不依赖任何其他模块）"
type = "forbidden"
source_modules = ["studio.config"]
forbidden_modules = ["studio.db"]

[[tool.importlinter.contracts]]
name = "只有 db 定义 ORM 模型；其他模块只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.main"]
forbidden_modules = ["studio.db.models"]

[[tool.importlinter.contracts]]
name = "workspace 不直接依赖 db.models，只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.workspace"]
forbidden_modules = ["studio.db.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "workspace 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.workspace"]
forbidden_modules = ["studio.main"]

[[tool.importlinter.contracts]]
name = "agent 不 import stages（规则 2）：TurnRunner 只认识阶段定义协议"
type = "forbidden"
source_modules = ["studio.agent"]
forbidden_modules = ["studio.stages"]

[[tool.importlinter.contracts]]
name = "agent 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.agent"]
forbidden_modules = ["studio.main"]

[[tool.importlinter.contracts]]
name = "agent 不直接依赖 db.models，只通过 db.repo 读写（规则 5）"
type = "forbidden"
source_modules = ["studio.agent"]
forbidden_modules = ["studio.db.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "各阶段之间互不 import（规则 3）：共用代码放进 stages.common"
type = "independence"
modules = [
    "studio.stages.topic",
    "studio.stages.narrative",
    "studio.stages.animation",
]

[[tool.importlinter.contracts]]
name = "stages 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.stages"]
forbidden_modules = ["studio.main"]
