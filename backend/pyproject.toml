[project]
name = "studio"
version = "0.1.0"
description = "ai-video-studio 后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
    "pyright>=1.1,<2",
    "import-linter>=2.1,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "smoke: 需要真实 API key 的冒烟测试，默认从 `make check` 排除，由 `make smoke` 运行",
]

[tool.importlinter]
# R1（控制者裁定）：M1 T1 时只有 studio.config 和 studio.main 存在，
# 契约只能覆盖这两个模块。后续任务新建模块时，把 ARCHITECTURE §2
# 对应的分层规则补进这里（例如规则 2：agent 不 import stages）。
root_package = "studio"

[[tool.importlinter.contracts]]
name = "config 不依赖 main（组装层不能被下层反向依赖）"
type = "forbidden"
source_modules = ["studio.config"]
forbidden_modules = ["studio.main"]
